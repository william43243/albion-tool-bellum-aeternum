name: Build signed Android release APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build production-signed release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Materialize and verify production signing identity
        working-directory: android
        env:
          ALBION_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ALBION_UPLOAD_KEYSTORE_BASE64 }}
          ALBION_UPLOAD_STORE_PASSWORD: ${{ secrets.ALBION_UPLOAD_STORE_PASSWORD }}
          ALBION_UPLOAD_KEY_ALIAS: ${{ secrets.ALBION_UPLOAD_KEY_ALIAS }}
          ALBION_UPLOAD_KEY_PASSWORD: ${{ secrets.ALBION_UPLOAD_KEY_PASSWORD }}
          ALBION_UPLOAD_CERT_SHA256: ${{ secrets.ALBION_UPLOAD_CERT_SHA256 }}
        run: |
          set -eu
          for name in ALBION_UPLOAD_KEYSTORE_BASE64 ALBION_UPLOAD_STORE_PASSWORD ALBION_UPLOAD_KEY_ALIAS ALBION_UPLOAD_KEY_PASSWORD ALBION_UPLOAD_CERT_SHA256; do
            eval "value=\${$name}"
            test -n "$value" || { echo "Release signing secret $name is missing" >&2; exit 1; }
          done
          keystore="$RUNNER_TEMP/albion-production-release.keystore"
          printf '%s' "$ALBION_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          actual="$(keytool -list -v -keystore "$keystore" -storepass "$ALBION_UPLOAD_STORE_PASSWORD" -alias "$ALBION_UPLOAD_KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}')"
          expected="$(printf '%s' "$ALBION_UPLOAD_CERT_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')"
          test -n "$actual" && test "$actual" = "$expected" || { echo 'Release certificate fingerprint mismatch' >&2; exit 1; }
          {
            printf 'ALBION_UPLOAD_STORE_FILE=%s\n' "$keystore"
            printf 'ALBION_UPLOAD_STORE_PASSWORD=%s\n' "$ALBION_UPLOAD_STORE_PASSWORD"
            printf 'ALBION_UPLOAD_KEY_ALIAS=%s\n' "$ALBION_UPLOAD_KEY_ALIAS"
            printf 'ALBION_UPLOAD_KEY_PASSWORD=%s\n' "$ALBION_UPLOAD_KEY_PASSWORD"
          } >> gradle.properties

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build production-signed APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --max-workers=1

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: albion-market-release-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
