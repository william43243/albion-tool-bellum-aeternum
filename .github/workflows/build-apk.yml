name: Build signed Android release APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and validate unsigned release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            analytics/package-lock.json

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix analytics

      - name: Run release source gates
        run: |
          set -euo pipefail
          npm test
          npm run typecheck
          python3 tests/test_web_security_regressions.py

      - name: Run native unit tests
        run: android/gradlew -p android :app:testDebugUnitTest --no-daemon --max-workers=1

      - name: Prove release packaging fails closed without signing authorization
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          rm -rf android/app/build/outputs/apk android/app/build/outputs/bundle
          mkdir -p android/app/build/outputs
          for task in :app:assembleRelease :app:bundleRelease :app:packageReleaseBundle :app:packageReleaseUniversalApk; do
            log="$RUNNER_TEMP/unsigned-refusal-${task##*:}.log"
            if android/gradlew -p android "$task" --no-daemon --max-workers=1 > "$log" 2>&1; then
              echo "Release packaging task $task unexpectedly succeeded without credentials or explicit unsigned authorization" >&2
              exit 1
            fi
            grep -F 'Release packaging refused:' "$log" >/dev/null
            if find android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit | grep -q .; then
              echo "Release packaging task $task left an APK or AAB output after refusal" >&2
              exit 1
            fi
          done

      - name: Prove unsigned authorization cannot carry production signing properties
        run: |
          set -euo pipefail
          for property in ALBION_UPLOAD_KEYSTORE_BASE64 ALBION_UPLOAD_STORE_PASSWORD ALBION_UPLOAD_KEY_ALIAS ALBION_UPLOAD_KEY_PASSWORD ALBION_UPLOAD_CERT_SHA256; do
            rm -rf android/app/build/outputs/apk android/app/build/outputs/bundle
            mkdir -p android/app/build/outputs
            log="$RUNNER_TEMP/signing-property-refusal-$property.log"
            if android/gradlew -p android :app:assembleRelease -PALBION_ALLOW_UNSIGNED_RELEASE=true "-P$property=probe" --no-daemon --max-workers=1 > "$log" 2>&1; then
              echo "Release packaging unexpectedly accepted production property $property" >&2
              exit 1
            fi
            grep -F 'Release packaging refused: Gradle must never receive ALBION_UPLOAD_* production signing credentials.' "$log" >/dev/null
            if find android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit | grep -q .; then
              echo "Production property $property left an APK or AAB output after refusal" >&2
              exit 1
            fi
          done

      - name: Build explicit unsigned release candidate
        run: android/gradlew -p android :app:assembleRelease -PALBION_ALLOW_UNSIGNED_RELEASE=true --no-daemon --max-workers=1

      - name: Run blocking Android lint
        run: android/gradlew -p android :app:lintDebug --no-daemon --max-workers=1

      - name: Validate unsigned release candidate
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          tools_dir="$ANDROID_HOME/build-tools/36.0.0"
          test -f "$apk"
          if "$tools_dir/apksigner" verify "$apk" >/dev/null 2>&1; then
            echo 'Unsigned candidate unexpectedly has a valid APK signature' >&2
            exit 1
          fi
          expected_name="$(node -p "require('./package.json').version")"
          expected_code="$(node -p "require('./app.json').expo.android.versionCode")"
          badging="$("$tools_dir/aapt2" dump badging "$apk")"
          package_line="$(printf '%s\n' "$badging" | grep '^package:')"
          case "$package_line" in
            "package: name='com.albion.market' versionCode='$expected_code' versionName='$expected_name' "*) ;;
            *) echo 'Package ID or packaged version metadata mismatch' >&2; exit 1 ;;
          esac
          printf '%s\n' "$badging" | grep -Fx "minSdkVersion:'24'" >/dev/null
          if printf '%s\n' "$badging" | grep -Fx 'application-debuggable' >/dev/null; then
            echo 'Release candidate is unexpectedly debuggable' >&2
            exit 1
          fi
          unzip -Z1 "$apk" | grep -Fx 'assets/index.android.bundle' >/dev/null
          actual_abis="$(unzip -Z1 "$apk" | awk -F/ '/^lib\/[^/]+\/.*\.so$/ {print $2}' | sort -u | paste -sd, -)"
          test "$actual_abis" = 'arm64-v8a,x86_64' || { echo "Unexpected packaged ABI set: $actual_abis" >&2; exit 1; }
          for abi in arm64-v8a x86_64; do
            unzip -Z1 "$apk" | grep -Fx "lib/$abi/liblitertlm_jni.so" >/dev/null
          done
          unzip -t "$apk" >/dev/null
          "$tools_dir/zipalign" -c -P 16 -v 4 "$apk" >/dev/null
          rm -rf release-candidate
          mkdir -p release-candidate
          cp "$apk" release-candidate/albion-market-release-unsigned.apk
          printf 'EXPECTED_NAME=%s\nEXPECTED_CODE=%s\n' "$expected_name" "$expected_code" > release-candidate/release-metadata.env

      - name: Upload unsigned release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: albion-market-release-unsigned
          path: release-candidate/
          retention-days: 7

  sign:
    name: Sign and verify production release APK
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: production-signing
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download validated unsigned candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: albion-market-release-unsigned
          path: release-candidate

      - name: Sign and verify in isolated environment
        id: sign-release
        env:
          ALBION_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ALBION_UPLOAD_KEYSTORE_BASE64 }}
          ALBION_UPLOAD_STORE_PASSWORD: ${{ secrets.ALBION_UPLOAD_STORE_PASSWORD }}
          ALBION_UPLOAD_KEY_ALIAS: ${{ secrets.ALBION_UPLOAD_KEY_ALIAS }}
          ALBION_UPLOAD_KEY_PASSWORD: ${{ secrets.ALBION_UPLOAD_KEY_PASSWORD }}
          ALBION_UPLOAD_CERT_SHA256: ${{ secrets.ALBION_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in ALBION_UPLOAD_KEYSTORE_BASE64 ALBION_UPLOAD_STORE_PASSWORD ALBION_UPLOAD_KEY_ALIAS ALBION_UPLOAD_KEY_PASSWORD ALBION_UPLOAD_CERT_SHA256; do
            eval "value=\${$name}"
            test -n "$value" || { echo "Release signing secret $name is missing" >&2; exit 1; }
          done

          signing_dir="$RUNNER_TEMP/albion-signing"
          trap 'rm -rf "$signing_dir"' EXIT
          mkdir -m 700 "$signing_dir"
          output_dir="$GITHUB_WORKSPACE/verified-release"
          rm -rf "$output_dir"
          mkdir -m 700 "$output_dir"
          keystore="$signing_dir/albion-production-release.keystore"
          printf '%s' "$ALBION_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"

          actual_cert="$(keytool -list -v -keystore "$keystore" -storepass:env ALBION_UPLOAD_STORE_PASSWORD -alias "$ALBION_UPLOAD_KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}' | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          expected_cert="$(printf '%s' "$ALBION_UPLOAD_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test -n "$actual_cert" && test "$actual_cert" = "$expected_cert" || { echo 'Release certificate fingerprint mismatch' >&2; exit 1; }

          metadata='release-candidate/release-metadata.env'
          expected_name="$(sed -n 's/^EXPECTED_NAME=//p' "$metadata")"
          expected_code="$(sed -n 's/^EXPECTED_CODE=//p' "$metadata")"
          case "$expected_name" in *[!A-Za-z0-9._-]*|'') echo 'Invalid expected version name' >&2; exit 1;; esac
          case "$expected_code" in *[!0-9]*|'') echo 'Invalid expected version code' >&2; exit 1;; esac

          tools_dir="$ANDROID_HOME/build-tools/36.0.0"
          unsigned_apk='release-candidate/albion-market-release-unsigned.apk'
          aligned_apk="$signing_dir/albion-market-release-aligned.apk"
          final_apk="$output_dir/albion-market-v${expected_name}-release.apk"
          "$tools_dir/zipalign" -f -P 16 4 "$unsigned_apk" "$aligned_apk"
          "$tools_dir/apksigner" sign \
            --v4-signing-enabled false \
            --ks "$keystore" \
            --ks-key-alias "$ALBION_UPLOAD_KEY_ALIAS" \
            --ks-pass env:ALBION_UPLOAD_STORE_PASSWORD \
            --key-pass env:ALBION_UPLOAD_KEY_PASSWORD \
            --out "$final_apk" \
            "$aligned_apk"

          "$tools_dir/apksigner" verify --verbose --print-certs "$final_apk" > "$RUNNER_TEMP/apksigner.txt"
          grep -Fx 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/apksigner.txt" >/dev/null
          grep -Fx 'Number of signers: 1' "$RUNNER_TEMP/apksigner.txt" >/dev/null
          packaged_cert="$(awk '/certificate SHA-256 digest:/{print $NF; exit}' "$RUNNER_TEMP/apksigner.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$packaged_cert" = "$expected_cert" || { echo 'Packaged certificate fingerprint mismatch' >&2; exit 1; }

          badging="$("$tools_dir/aapt2" dump badging "$final_apk")"
          package_line="$(printf '%s\n' "$badging" | grep '^package:')"
          case "$package_line" in
            "package: name='com.albion.market' versionCode='$expected_code' versionName='$expected_name' "*) ;;
            *) echo 'Signed package ID or version metadata mismatch' >&2; exit 1 ;;
          esac
          printf '%s\n' "$badging" | grep -Fx "minSdkVersion:'24'" >/dev/null
          if printf '%s\n' "$badging" | grep -Fx 'application-debuggable' >/dev/null; then
            echo 'Signed release APK is unexpectedly debuggable' >&2
            exit 1
          fi
          unzip -Z1 "$final_apk" | grep -Fx 'assets/index.android.bundle' >/dev/null
          actual_abis="$(unzip -Z1 "$final_apk" | awk -F/ '/^lib\/[^/]+\/.*\.so$/ {print $2}' | sort -u | paste -sd, -)"
          test "$actual_abis" = 'arm64-v8a,x86_64' || { echo "Unexpected signed ABI set: $actual_abis" >&2; exit 1; }
          for abi in arm64-v8a x86_64; do
            unzip -Z1 "$final_apk" | grep -Fx "lib/$abi/liblitertlm_jni.so" >/dev/null
          done
          unzip -t "$final_apk" >/dev/null
          "$tools_dir/zipalign" -c -P 16 -v 4 "$final_apk" >/dev/null
          (
            cd "$output_dir"
            sha256sum "$(basename "$final_apk")" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          test "$(find "$output_dir" -maxdepth 1 -type f | wc -l)" -eq 2
          test -f "$output_dir/SHA256SUMS"
          printf 'apk_path=%s\nchecksum_path=%s\n' "$final_apk" "$output_dir/SHA256SUMS" >> "$GITHUB_OUTPUT"

      - name: Upload verified production-signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: albion-market-release-signed
          path: |
            ${{ steps.sign-release.outputs.apk_path }}
            ${{ steps.sign-release.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 30

  verify-signed-artifact:
    name: Re-download and verify signed artifact
    needs: sign
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download exact signed artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: albion-market-release-signed
          path: verified-artifact

      - name: Verify extracted artifact structure and checksum
        run: |
          set -euo pipefail
          cd verified-artifact
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 2
          test -f SHA256SUMS
          apk="$(find . -maxdepth 1 -type f -name 'albion-market-v*-release.apk' -printf '%f\n')"
          test -n "$apk"
          test "$(printf '%s\n' "$apk" | wc -l)" -eq 1
          expected_entry="$(awk '{print $2}' SHA256SUMS)"
          test "$expected_entry" = "$apk"
          case "$expected_entry" in */*) echo 'Checksum manifest must contain a basename only' >&2; exit 1;; esac
          sha256sum -c SHA256SUMS

  publish-release:
    name: Publish verified APK to the website release URL
    needs: verify-signed-artifact
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: albion-production-release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download exact verified signed artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: albion-market-release-signed
          path: verified-artifact

      - name: Publish and verify exact prerelease asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          case "$version" in *[!A-Za-z0-9._-]*|'') echo 'Invalid release version' >&2; exit 1;; esac
          tag="v$version"
          expected_asset="albion-market-v${version}-release.apk"
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$GITHUB_SHA" || { echo 'Refusing to publish a stale main revision' >&2; exit 1; }

          verify_tag_target() {
            local ref_json tag_sha tag_type tag_json
            ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")"
            tag_sha="$(printf '%s' "$ref_json" | jq -r '.object.sha')"
            tag_type="$(printf '%s' "$ref_json" | jq -r '.object.type')"
            while test "$tag_type" = tag; do
              tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")"
              tag_sha="$(printf '%s' "$tag_json" | jq -r '.object.sha')"
              tag_type="$(printf '%s' "$tag_json" | jq -r '.object.type')"
            done
            test "$tag_type" = commit
            test "$tag_sha" = "$GITHUB_SHA"
          }

          cd verified-artifact
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 2
          test -f "$expected_asset"
          test -f SHA256SUMS
          test "$(awk '{print $2}' SHA256SUMS)" = "$expected_asset"
          sha256sum -c SHA256SUMS

          if release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>/dev/null)"; then
            verify_tag_target
            printf '%s' "$release_json" | jq -e --arg sha "$GITHUB_SHA" \
              '.draft == false and .prerelease == true and .target_commitish == $sha' >/dev/null
          else
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              verify_tag_target
            fi
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Albion Market $version" --notes "Verified production-signed Android prerelease $version."
            verify_tag_target
          fi

          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          printf '%s' "$release_json" | jq -e --arg sha "$GITHUB_SHA" \
            '.draft == false and .prerelease == true and .target_commitish == $sha' >/dev/null

          verify_asset() {
            local asset="$1" authenticated_dir anonymous_file
            authenticated_dir="$RUNNER_TEMP/release-readback-$asset"
            anonymous_file="$RUNNER_TEMP/anonymous-$asset"
            rm -rf "$authenticated_dir" "$anonymous_file"
            mkdir -p "$authenticated_dir"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$authenticated_dir"
            cmp -s "$asset" "$authenticated_dir/$asset"
            curl --retry 5 --retry-all-errors --retry-delay 2 --fail --location --silent --show-error \
              --output "$anonymous_file" \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$asset"
            cmp -s "$asset" "$anonymous_file"
          }

          # Verify every pre-existing byte before any new external write.
          for asset in "$expected_asset" SHA256SUMS; do
            asset_count="$(printf '%s' "$release_json" | jq -r '.assets[]?.name' | grep -Fxc "$asset" || true)"
            test "$asset_count" -le 1
            if test "$asset_count" -eq 1; then
              verify_asset "$asset"
            fi
          done

          for asset in "$expected_asset" SHA256SUMS; do
            asset_count="$(printf '%s' "$release_json" | jq -r '.assets[]?.name' | grep -Fxc "$asset" || true)"
            if test "$asset_count" -eq 0; then
              gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY"
            fi
          done

          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          for asset in "$expected_asset" SHA256SUMS; do
            test "$(printf '%s' "$release_json" | jq -r '.assets[]?.name' | grep -Fxc "$asset")" -eq 1
            verify_asset "$asset"
          done
