limit_req_zone $http_x_real_ip zone=tracking:10m rate=60r/m;
limit_req_zone $http_x_real_ip zone=admin:10m rate=60r/m;
limit_req_zone $http_x_real_ip zone=public_api:10m rate=30r/m;

server {
    listen 80;
    server_name albion-tool-bellum-aeternum.com;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # The public TLS gateway owns canonical transport/security headers.
    # Keep internal redirects relative because this hop receives proxied HTTP.
    absolute_redirect off;

    # Landing page
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Expo web app
    location /app/ {
        alias /usr/share/nginx/html/app/;
        try_files $uri $uri/ /app/index.html;
    }

    # APK downloads — served from the /data/apks/ bind mount so publishing a new
    # version does not require rebuilding the Docker image. See publish.js CLI.
    location /downloads/ {
        alias /data/apks/;
        autoindex off;
        add_header Cache-Control "public, max-age=300";
    }

    # Assets (shared)
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Admin dashboard
    location = /admin {
        return 308 /admin/;
    }
    location /admin/ {
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
    }

    # Analytics API — proxy to Node.js backend
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        # The host proxy must overwrite X-Real-IP with its validated client IP.
        # Replace any incoming X-Forwarded-For chain instead of appending to it.
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header Host $host;
    }

    location /api/track/ {
        limit_req zone=tracking burst=20 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header Host $host;
    }

    location /api/stats/ {
        limit_req zone=admin burst=10 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header Host $host;
    }

    location = /api/version {
        limit_req zone=public_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header Host $host;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
