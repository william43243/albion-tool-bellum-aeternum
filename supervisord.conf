[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:analytics]
command=node /opt/analytics/server.js
directory=/opt/analytics
user=nginx
umask=0077
autostart=true
autorestart=true
environment=DB_PATH="/data/analytics.db",PORT="3001",ADMIN_TOKEN_FILE="/data/admin-token"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
