// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  ext.kotlinVersion = '2.3.0'
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// React Native Screens also builds C++ in release. Keep its generated paths
// short on Windows without editing the installed third-party package.
subprojects { subproject ->
  if (subproject.name == 'react-native-screens') {
    subproject.afterEvaluate {
      def cacheId = Integer.toHexString(rootProject.projectDir.absolutePath.hashCode())
      subproject.android.externalNativeBuild.cmake.buildStagingDirectory = new File(System.getProperty('java.io.tmpdir'), "albion-screens-${cacheId}")
      subproject.android.defaultConfig.externalNativeBuild.cmake.arguments '-DCMAKE_OBJECT_PATH_MAX=240'
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
