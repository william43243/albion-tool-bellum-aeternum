events {}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=global:10m rate=10r/s;

    map $http_cf_connecting_ip $albion_client_ip {
        default $http_cf_connecting_ip;
        ""      $remote_addr;
    }

    server {
        listen 80;
        server_name 187.77.97.84;
        location / {
            proxy_pass http://host.docker.internal:18081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 80;
        server_name albion-tool-bellum-aeternum.com www.albion-tool-bellum-aeternum.com serveur.albion-tool-bellum-aeternum.com;
        return 308 https://$host$request_uri;
    }

    server {
        listen 80 default_server;
        server_name _;
        location / {
            proxy_pass http://goblin:80;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 443 ssl;
        server_name albion-tool-bellum-aeternum.com www.albion-tool-bellum-aeternum.com serveur.albion-tool-bellum-aeternum.com;
        ssl_certificate /etc/nginx/ssl/albion-market.crt;
        ssl_certificate_key /etc/nginx/ssl/albion-market.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://west.albion-online-data.com https://europe.albion-online-data.com https://east.albion-online-data.com https://huggingface.co https://cdn-lfs.hf.co https://cdn-lfs-us-1.hf.co https://cdn-lfs-eu-1.hf.co https://cas-bridge.xethub.hf.co; form-action 'self'; upgrade-insecure-requests" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;

        location ^~ /admin/ { return 404; }
        location = /admin { return 404; }
        location = /api/stats/public {
            proxy_pass http://albion:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $albion_client_ip;
            proxy_set_header X-Forwarded-For $albion_client_ip;
            proxy_set_header X-Forwarded-Proto https;
        }
        location ^~ /api/stats/ { return 404; }

        location / {
            proxy_pass http://albion:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $albion_client_ip;
            proxy_set_header X-Forwarded-For $albion_client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect http:// https://;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Permissions-Policy;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cross-Origin-Opener-Policy;
            proxy_hide_header Cross-Origin-Resource-Policy;
        }
        location ~ /\. { deny all; }
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name xmr-miner.com www.xmr-miner.com;
        ssl_certificate /etc/nginx/ssl/xmr-miner.crt;
        ssl_certificate_key /etc/nginx/ssl/xmr-miner.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        location = /testing { default_type text/plain; alias /var/www/install-termux.sh; }
        location = /go { default_type text/plain; alias /var/www/go; }
        location = /per-src.tar.gz { alias /var/www/per-src.tar.gz; }
        location / {
            limit_req zone=global burst=20 nodelay;
            proxy_pass http://xmr:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location ~ /\. { deny all; }
    }
}
